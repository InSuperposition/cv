name: publish-unsigned-fixture

# A manual run pushes the chart as cv-unsigned to ghcr.io and does not sign it.
# It is a test fixture: a consumer that verifies chart signatures must refuse
# it. Consumers pin it by digest, which the run prints.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Chart version of the fixture
        required: true
        default: 0.0.1

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      OWNER: ${{ github.repository_owner }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - run: ./scripts/publish-unsigned-fixture.sh "${VERSION}" "ghcr.io/${OWNER}/charts"
