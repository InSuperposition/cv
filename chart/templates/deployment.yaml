apiVersion: apps/v1
kind: Deployment
metadata:
  name: cv
  labels:
    {{- include "cv.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "cv.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cv.labels" . | nindent 8 }}
    spec:
      serviceAccountName: cv
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cv
          image: {{ .Values.image.repository }}@{{ .Values.image.digest }}
          env:
            - name: PORT
              value: {{ .Values.port | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
